<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — MMC</title>
<meta name="description" content="Set a new password for your MMC account.">
<link rel="canonical" href="https://mmc-group.com/reset-password.html">
<meta name="robots" content="noindex, follow">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Reset Password — MMC">
<meta property="og:description" content="Set a new password for your MMC account.">
<meta property="og:url" content="https://mmc-group.com/reset-password.html">
<meta property="og:image" content="https://mmc-group.com/assets/logo.jpeg">
<meta property="og:site_name" content="MMC">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Reset Password — MMC">
<meta name="twitter:description" content="Set a new password for your MMC account.">
<meta name="twitter:image" content="https://mmc-group.com/assets/logo.jpeg">
<link rel="icon" href="assets/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body[data-page="reset-password"] .nav {
  background: rgba(30,30,30,.82);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 6px 30px rgba(0,0,0,.25);
  padding: 12px 0;
}
</style>
</head>
<body data-page="reset-password">

<!-- LOADER -->
<div class="loader" id="loader">
  <img src="assets/logo.jpeg" alt="" class="loader-coin">
</div>

<!-- NAV -->
<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <img src="assets/logo.jpeg" alt="MMC" class="nav-coin">
    </a>
    <div class="nav-menu" id="navMenu">
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html#achievements" class="nav-link">Achievements</a></li>
        <li><a href="home.html#home" class="nav-link">Home</a></li>
        <li><a href="contact.html#contact" class="nav-link">Contact</a></li>
      </ul>
      <div class="nav-actions" id="navActions">
        <a href="login.html" class="btn btn-ghost" id="navLoginLink">Login</a>
        <a href="register.html" class="btn btn-gold" id="navJoinLink">Join Club</a>
      </div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<section class="auth-section">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="assets/logo.jpeg" alt="MMC">
    </div>
    <h1>Set a new password</h1>
    <p class="auth-sub">Choose a new password for your account.</p>

    <p class="auth-error-banner" id="resetError" role="alert"></p>

    <!-- Shown if there's no token in the URL at all -->
    <p class="auth-error-banner show" id="resetNoToken" style="display:none;">
      This link is missing a reset token. Please request a new one from the
      <a href="forgot-password.html">forgot password page</a>.
    </p>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="resetPassword">New password</label>
        <input type="password" id="resetPassword" name="password" placeholder="At least 8 characters" required>
        <span class="field-error" data-error="password"></span>
      </div>
      <div class="field">
        <label for="resetConfirmPassword">Confirm new password</label>
        <input type="password" id="resetConfirmPassword" name="confirmPassword" placeholder="Re-enter your new password" required>
        <span class="field-error" data-error="confirmPassword"></span>
      </div>
      <button type="submit" class="btn btn-gold btn-lg btn-block" id="resetSubmit">Update Password</button>
      <p class="form-success" id="resetSuccess" role="status">Password updated — redirecting to login...</p>
    </form>

    <p class="auth-footer-note">Remembered it after all? <a href="login.html">Back to login</a></p>
  </div>
</section>

<script src="config.js"></script>
<script src="analytics.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
