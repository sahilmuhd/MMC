<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#4A1522" />
      <stop offset="55%" stop-color="#2a1017" />
      <stop offset="100%" stop-color="#121212" />
    </radialGradient>
    <linearGradient id="goldFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3D77A" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGlow)" />

  <!-- subtle diagonal facet lines, matching .hero-facets / .showcase-facets treatment -->
  <g stroke="rgba(212,175,55,0.08)" stroke-width="1">
    <path d="M0 60 L800 200" /><path d="M0 160 L800 340" /><path d="M0 320 L800 90" />
    <path d="M0 420 L800 250" /><path d="M100 0 L500 450" /><path d="M600 0 L300 450" />
  </g>

  <!-- radiating rays behind the trophy -->
  <g stroke="rgba(212,175,55,0.35)" stroke-width="1.5" stroke-linecap="round">
    <path d="M400 210 L400 70" />
    <path d="M400 210 L470 90" />
    <path d="M400 210 L330 90" />
    <path d="M400 210 L520 130" />
    <path d="M400 210 L280 130" />
    <path d="M400 210 L545 190" />
    <path d="M400 210 L255 190" />
  </g>

  <!-- small stars -->
  <g fill="#D4AF37" opacity="0.85">
    <circle cx="140" cy="90" r="52" fill="url(#starGlow)" />
    <path d="M140 78 L143 87 L152 87 L145 93 L148 102 L140 96 L132 102 L135 93 L128 87 L137 87 Z" />
    <circle cx="660" cy="120" r="46" fill="url(#starGlow)" />
    <path d="M660 110 L662.5 117 L670 117 L664 121.5 L666 128.5 L660 124 L654 128.5 L656 121.5 L650 117 L657.5 117 Z" />
    <circle cx="700" cy="340" r="3" />
    <circle cx="110" cy="330" r="2.5" />
    <circle cx="230" cy="60" r="2" />
    <circle cx="580" cy="60" r="2" />
  </g>

  <!-- ascending podium steps, line-art style consistent with rank icons -->
  <g stroke="url(#goldFade)" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M235 380 L235 330 L325 330 L325 380 Z" />
    <path d="M325 380 L325 285 L475 285 L475 380 Z" />
    <path d="M475 380 L475 335 L565 335 L565 380 Z" />
  </g>
  <g fill="rgba(212,175,55,0.06)">
    <path d="M235 380 L235 330 L325 330 L325 380 Z" />
    <path d="M325 380 L325 285 L475 285 L475 380 Z" />
    <path d="M475 380 L475 335 L565 335 L565 380 Z" />
  </g>
  <text x="280" y="362" text-anchor="middle" fill="#D4AF37" font-family="Poppins, sans-serif" font-size="22" font-weight="600">2</text>
  <text x="400" y="330" text-anchor="middle" fill="#F3D77A" font-family="Poppins, sans-serif" font-size="26" font-weight="700">1</text>
  <text x="520" y="366" text-anchor="middle" fill="#D4AF37" font-family="Poppins, sans-serif" font-size="22" font-weight="600">3</text>

  <!-- trophy on the top step, same thin-stroke language as RANK_ICONS -->
  <g transform="translate(400,235)" stroke="url(#goldFade)" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-22 -30 L22 -30 L18 -6 C18 8 8 16 0 16 C-8 16 -18 8 -18 -6 Z" />
    <path d="M-22 -26 C-34 -26 -34 -8 -22 -6" />
    <path d="M22 -26 C34 -26 34 -8 22 -6" />
    <path d="M0 16 L0 30" />
    <path d="M-16 40 L16 40 L12 30 L-12 30 Z" />
    <path d="M-4 -22 L4 -22 L1 -12 L6 -12 L-3 2 L-1 -9 L-6 -9 Z" fill="#D4AF37" stroke="none" />
  </g>

  <!-- bottom fade so any caption/overlay text stays readable -->
  <rect x="0" y="360" width="800" height="90" fill="url(#bottomFade)" opacity="0.001" />
</svg>
